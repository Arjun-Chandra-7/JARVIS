# Jarvis echo cancellation: a small PipeWire client running PipeWire's echo-cancel module with
# the WebRTC canceller. Started by the jarvis-aec user service (scripts/install-aec-service.sh).
#
#   jarvis_aec_sink    everything played goes through it (it is made the default output), so
#                      Jarvis's voice and the browser's video are the reference signal
#   jarvis_aec_source  the microphone with that reference subtracted; Jarvis listens here
#
# Gain control is off: the voice pipeline measures loudness itself, and an AGC riding the level
# up in a quiet room makes the fan sound like speech. Noise suppression is on but mild (WebRTC's
# default level); it was checked not to damage Hindi — see README "Echo cancellation".
context.properties = {
    log.level = 2
}
context.spa-libs = {
    audio.convert.* = audioconvert/libspa-audioconvert
    support.*       = support/libspa-support
}
context.modules = [
    { name = libpipewire-module-rt  flags = [ ifexists nofail ] }
    { name = libpipewire-module-protocol-native }
    { name = libpipewire-module-client-node }
    { name = libpipewire-module-adapter }
    { name = libpipewire-module-echo-cancel
        args = {
            library.name  = aec/libspa-aec-webrtc
            node.latency  = 480/48000
            audio.rate    = 48000
            audio.channels = 1
            audio.position = [ MONO ]
            aec.args = {
                webrtc.gain_control     = false
                webrtc.extended_filter  = true
                webrtc.noise_suppression = true
                webrtc.high_pass_filter = true
            }
            capture.props = {
                node.name    = "jarvis_aec_capture"
                node.passive = true
            }
            source.props = {
                node.name        = "jarvis_aec_source"
                node.description = "Jarvis microphone (echo cancelled)"
            }
            sink.props = {
                node.name        = "jarvis_aec_sink"
                node.description = "Speakers (Jarvis echo cancellation)"
            }
            playback.props = {
                node.name    = "jarvis_aec_playback"
                node.passive = true
            }
        }
    }
]
