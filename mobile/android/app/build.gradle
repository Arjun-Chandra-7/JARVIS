plugins { id 'com.android.application' }

android {
    namespace 'com.arjun.jarvis'
    compileSdk 35

    defaultConfig {
        applicationId 'com.arjun.jarvis'
        minSdk 26
        targetSdk 35
        versionCode 1
        versionName '0.1.0'
    }
}

dependencies {
    implementation 'androidx.activity:activity:1.9.3'
    implementation 'androidx.appcompat:appcompat:1.7.0'
    implementation 'androidx.core:core:1.13.1'
    // Local wake word and offline command transcription. The model itself is not in git.
    implementation 'com.alphacephei:vosk-android:0.3.47'
    implementation 'net.java.dev.jna:jna:5.14.0@aar'
}

// Since Kotlin 1.8 the stdlib includes the old jdk7/jdk8 split modules; a stale
// transitive 1.6.21 copy collides with the 1.8.22 stdlib AndroidX pulls in.
configurations.all {
    resolutionStrategy { force 'org.jetbrains.kotlin:kotlin-stdlib:1.8.22' }
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk7'
    exclude group: 'org.jetbrains.kotlin', module: 'kotlin-stdlib-jdk8'
}
