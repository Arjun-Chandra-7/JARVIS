<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1" />
<title>JARVIS</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@400;600;800&family=Rajdhani:wght@400;500;600&display=swap" rel="stylesheet" />
<script src="https://unpkg.com/gsap@3.12.5/dist/gsap.min.js"></script>
<script type="importmap">
{ "imports": {
  "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
}}
</script>
<style>
  :root{
    --cyan:#5aa2b8; --gold:#c79a55; --red:#d06674; --violet:#8f7fc0; --green:#38b98a;
    --bg:#04070d; --glass:rgba(10,18,30,.34); --line:rgba(90,162,184,.22);
  }
  *{box-sizing:border-box;margin:0;padding:0}
  html,body{height:100%;background:var(--bg);color:#dbeafe;font-family:'Rajdhani',sans-serif;overflow:hidden;cursor:crosshair}
  #scene{position:fixed;inset:0;z-index:0}
  .vignette{position:fixed;inset:0;z-index:1;pointer-events:none;
    background:radial-gradient(120% 90% at 50% 45%,transparent 40%,rgba(0,0,0,.55) 100%);}
  .scanlines{position:fixed;inset:0;z-index:2;pointer-events:none;opacity:.035;
    background:repeating-linear-gradient(to bottom,rgba(56,225,255,.5) 0,rgba(56,225,255,.5) 1px,transparent 2px,transparent 4px);
    animation:scan 8s linear infinite}
  @keyframes scan{to{background-position:0 200px}}
  .hud{position:fixed;inset:0;z-index:3;pointer-events:none}
  .hud>*{pointer-events:auto}

  /* top bar */
  .topbar{position:absolute;top:22px;left:28px;right:28px;display:flex;justify-content:space-between;align-items:flex-start}
  .brand{font-family:'Orbitron';font-weight:800;letter-spacing:.5em;font-size:19px;
    color:#cfe0ea;text-shadow:0 0 8px rgba(90,162,184,.5)}
  .brand small{display:block;font-family:'Rajdhani';letter-spacing:.35em;font-size:11px;opacity:.6;margin-top:4px}
  .brand b{color:var(--cyan)}
  .clock{font-family:'Orbitron';font-size:26px;letter-spacing:.15em;text-shadow:0 0 14px var(--cyan);text-align:right}
  .clock small{display:block;text-align:right;font-family:'Rajdhani';font-size:11px;letter-spacing:.3em;opacity:.55}
  .clock .wx{color:var(--gold);letter-spacing:.2em}

  /* status pill */
  .status{position:absolute;top:15%;left:50%;transform:translate(-50%,-50%);
    text-align:center;font-family:'Orbitron';letter-spacing:.4em;pointer-events:none;user-select:none}
  .status .state{font-size:15px;color:var(--cyan);text-shadow:0 0 20px var(--cyan);transition:color .4s}
  .status .sub{font-family:'Rajdhani';font-size:12px;letter-spacing:.3em;opacity:.5;margin-top:6px}

  /* side panels */
  .panel{position:absolute;width:250px;background:var(--glass);border:1px solid var(--line);
    border-radius:14px;padding:14px 16px;backdrop-filter:blur(9px);
    box-shadow:0 0 30px rgba(56,225,255,.06),inset 0 0 30px rgba(56,225,255,.05)}
  .panel h3{font-family:'Orbitron';font-size:11px;font-weight:600;letter-spacing:.28em;color:var(--cyan);
    opacity:.9;margin-bottom:12px;display:flex;justify-content:space-between}
  .left{left:28px;top:96px}
  .right{right:28px;top:96px}
  .bar{height:6px;border-radius:4px;background:rgba(56,225,255,.12);margin:9px 0;overflow:hidden;position:relative}
  .bar i{position:absolute;inset:0;transform-origin:left;transform:scaleX(0);transition:transform .6s cubic-bezier(.2,.8,.2,1);
    background:linear-gradient(90deg,var(--cyan),var(--violet));box-shadow:0 0 12px var(--cyan)}
  .bar.hot i{background:linear-gradient(90deg,var(--gold),var(--red))}
  .lbl{font-size:11px;letter-spacing:.15em;opacity:.7;display:flex;justify-content:space-between;margin:9px 0 2px}
  .lbl b{color:#cfe6f0;opacity:.95;font-weight:600}
  .sys{font-size:13px;letter-spacing:.06em;line-height:2.05}
  .sys div{display:flex;align-items:center;justify-content:space-between;opacity:.9}
  .sys .nm{display:flex;align-items:center}
  .sys .dot{display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--green);
    box-shadow:0 0 8px var(--green);margin-right:9px}
  .sys .off{opacity:.45}
  .sys .off .dot{background:#456;box-shadow:none}
  .sys .meta{font-size:11px;letter-spacing:.08em;opacity:.6;font-family:'Rajdhani'}

  /* corner ticks */
  .corner{position:absolute;width:44px;height:44px;border:2px solid var(--line);pointer-events:none}
  .c1{top:14px;left:14px;border-right:0;border-bottom:0}
  .c2{top:14px;right:14px;border-left:0;border-bottom:0}
  .c3{bottom:14px;left:14px;border-right:0;border-top:0}
  .c4{bottom:14px;right:14px;border-left:0;border-top:0}

  /* quick-action chips */
  .quick{position:absolute;left:50%;bottom:190px;transform:translateX(-50%);display:flex;gap:10px;flex-wrap:wrap;justify-content:center;width:min(760px,86vw)}
  .chip{display:flex;align-items:center;gap:7px;background:var(--glass);border:1px solid var(--line);border-radius:30px;
    padding:7px 15px;font-size:13px;letter-spacing:.08em;color:#cfe6f0;cursor:pointer;backdrop-filter:blur(9px);
    transition:.2s;text-transform:uppercase;font-family:'Rajdhani';font-weight:600}
  .chip:hover{background:rgba(56,225,255,.16);box-shadow:0 0 20px rgba(56,225,255,.3);border-color:var(--cyan);transform:translateY(-2px)}
  .chip svg{width:15px;height:15px;stroke:var(--cyan);fill:none;stroke-width:1.8}

  /* transcript + console */
  .console{position:absolute;left:50%;bottom:28px;transform:translateX(-50%);width:min(760px,86vw)}
  .log{max-height:150px;overflow-y:auto;display:flex;flex-direction:column;gap:8px;margin-bottom:12px;
    -webkit-mask-image:linear-gradient(to bottom,transparent,#000 22%);scrollbar-width:none}
  .log::-webkit-scrollbar{display:none}
  .msg{font-size:15px;letter-spacing:.03em;opacity:0;transform:translateY(10px);line-height:1.5}
  .msg .who{font-family:'Orbitron';font-size:10px;letter-spacing:.25em;opacity:.6;margin-right:10px}
  .msg .tm{font-size:10px;opacity:.35;margin-left:8px;letter-spacing:.1em}
  .msg.you .who{color:var(--gold)} .msg.jarvis .who{color:var(--cyan)}
  .msg.sys{opacity:.6;font-size:13px;letter-spacing:.12em}
  .msg.jarvis{text-shadow:0 0 12px rgba(56,225,255,.25)}
  .msg code{background:rgba(56,225,255,.12);padding:1px 6px;border-radius:5px;font-size:13px}
  .inputrow{display:flex;align-items:center;gap:12px;background:var(--glass);border:1px solid var(--line);
    border-radius:40px;padding:8px 8px 8px 22px;backdrop-filter:blur(9px);
    box-shadow:0 0 40px rgba(56,225,255,.10)}
  .inputrow.focus{border-color:var(--cyan);box-shadow:0 0 46px rgba(56,225,255,.25)}
  .inputrow input{flex:1;background:none;border:0;outline:0;color:#eaf6ff;font-family:'Rajdhani';
    font-size:17px;letter-spacing:.04em}
  .inputrow input::placeholder{color:rgba(219,234,254,.4)}
  .iconbtn{width:46px;height:46px;border-radius:50%;border:1px solid var(--line);background:rgba(56,225,255,.08);
    color:var(--cyan);font-size:19px;display:grid;place-items:center;cursor:pointer;transition:.25s;flex:0 0 auto}
  .iconbtn:hover{background:rgba(56,225,255,.2);box-shadow:0 0 22px var(--cyan)}
  .mic.live{background:var(--red);color:#fff;border-color:var(--red);box-shadow:0 0 26px var(--red);animation:pulse 1.1s infinite}
  @keyframes pulse{50%{box-shadow:0 0 40px var(--red)}}
  .hint{text-align:center;font-size:11px;letter-spacing:.25em;opacity:.35;margin-top:10px;font-family:'Orbitron'}
  .hint b{color:var(--cyan);opacity:.8}

  /* toast */
  .toast{position:absolute;top:80px;left:50%;transform:translateX(-50%) translateY(-14px);opacity:0;
    background:var(--glass);border:1px solid var(--line);border-radius:30px;padding:9px 22px;font-size:13px;
    letter-spacing:.1em;backdrop-filter:blur(9px);transition:.3s;pointer-events:none;z-index:5}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
</style>
</head>
<body>
  <canvas id="scene"></canvas>
  <div class="vignette"></div>
  <div class="scanlines"></div>

  <div class="hud">
    <div class="corner c1"></div><div class="corner c2"></div>
    <div class="corner c3"></div><div class="corner c4"></div>

    <div class="topbar">
      <div class="brand">J.A.R.V.I.S<small>brain · <b id="brainlbl">…</b></small></div>
      <div class="clock"><span id="clk">--:--:--</span><small id="date">— — —</small><small class="wx" id="wx"></small></div>
    </div>

    <div class="status"><div class="state" id="state">STANDBY</div><div class="sub" id="substate">core online · awaiting input</div></div>

    <div class="panel left">
      <h3>CORE TELEMETRY <span id="pct">—</span></h3>
      <div class="lbl">CPU<b id="v1">—</b></div><div class="bar"><i id="b1"></i></div>
      <div class="lbl">MEMORY<b id="v2">—</b></div><div class="bar"><i id="b2"></i></div>
      <div class="lbl">GPU<b id="v3">—</b></div><div class="bar"><i id="b3"></i></div>
      <div class="lbl">DISK<b id="v4">—</b></div><div class="bar"><i id="b4"></i></div>
    </div>

    <div class="panel right">
      <h3>SYSTEMS <span id="syscount">—</span></h3>
      <div class="sys" id="sysrows"></div>
    </div>

    <div class="quick" id="quick"></div>

    <div class="console">
      <div class="log" id="log"></div>
      <div class="inputrow" id="inputrow">
        <input id="cmd" placeholder="Speak, or type a command for Jarvis…  ( / to focus )" autocomplete="off" />
        <div class="iconbtn mic" id="mic" title="Voice input">🎙</div>
        <div class="iconbtn" id="clearbtn" title="Clear conversation">⌫</div>
      </div>
      <div class="hint"><b>↵</b> SEND · <b>/</b> FOCUS · <b>ESC</b> BLUR · CLICK THE CORE TO PULSE</div>
    </div>
  </div>

  <div class="toast" id="toast"></div>

  <script type="module" src="./app.js"></script>
</body>
</html>
