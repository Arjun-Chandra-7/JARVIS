<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="voice">
    <div class="hud">
      <!-- ── conversation surface (text mode) ───────────────────────────── -->
      <section class="panel" id="panel">
        <header class="phead">
          <span class="wordmark">JARVIS</span>
          <div class="sysdots" id="sysdots" title="subsystems"></div>
          <div class="telemetry" id="telemetry"></div>
          <span class="brainlabel" id="brainlabel">online</span>
          <button class="ghost" id="clearBtn" title="Clear conversation">clear</button>
        </header>

        <div id="log" class="log"></div>

        <!-- Raycast-style result list: the input filters this, Enter runs the top hit -->
        <div class="results" id="results" hidden></div>
      </section>

      <!-- ── console bar (always visible) ───────────────────────────────── -->
      <section class="bar" id="bar">
        <div class="optics" title="optics">
          <video id="cam" autoplay muted playsinline></video>
          <canvas id="handfx"></canvas>
          <span class="presence" id="presence"></span>
        </div>

        <!-- the reactor: WebGL orb + gauges. Click or scroll to switch voice/text. -->
        <div class="reactor" id="orb" title="click or scroll — voice / text">
          <canvas id="reactorGl"></canvas>
          <svg class="mic" viewBox="0 0 24 24" aria-hidden="true">
            <rect x="9" y="3" width="6" height="11" rx="3" /><path d="M6 11a6 6 0 0 0 12 0M12 17v4M8 21h8" />
          </svg>
        </div>

        <div class="mid">
          <div class="statusrow">
            <span class="status" id="status">initialising</span>
            <canvas class="meter" id="meter" width="440" height="30"></canvas>
          </div>
          <div class="inputrow">
            <input id="msg" class="msg" type="text" autocomplete="off" spellcheck="false"
                   placeholder="ask Jarvis, or type a command…" />
            <kbd class="hint" id="hint">↵</kbd>
          </div>
        </div>

        <div class="right">
          <time class="clock" id="clock">--:--</time>
        </div>
      </section>
    </div>

    <!-- action panel: top layer, light-dismiss, keyboard driven -->
    <div id="actions" class="actionpanel" popover>
      <div class="apHead">Actions</div>
      <div class="apList" id="apList"></div>
    </div>

    <div id="toast" class="toast" role="status"></div>

    <script type="module" src="renderer.js"></script>
    <script type="module" src="gestures.js"></script>
  </body>
</html>
