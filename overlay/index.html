<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@400;500;600;700&family=Orbitron:wght@600;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body class="voice">
    <div class="hud">
      <!-- expanded panel (text mode): chat + actions -->
      <section class="expand">
        <div class="ehead"><span>J.A.R.V.I.S</span><em id="ehint">text mode</em></div>
        <div id="log" class="log"></div>
        <div class="actions">
          <button class="act" data-cmd="__phone" title="Phone"><svg viewBox="0 0 24 24"><rect x="7" y="2" width="10" height="20" rx="2"/><path d="M11 18h2"/></svg></button>
          <button class="act" id="awayBtn" data-say="I'm not available, cover my messages." title="Away"><svg viewBox="0 0 24 24"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"/></svg></button>
          <button class="act" data-say="what did I miss?" title="Catch up"><svg viewBox="0 0 24 24"><rect x="3" y="5" width="18" height="14" rx="2"/><path d="M3 7l9 6 9-6"/></svg></button>
          <button class="act" data-say="take a screenshot and tell me what's on my screen." title="Screen"><svg viewBox="0 0 24 24"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7-10-7-10-7z"/><circle cx="12" cy="12" r="3"/></svg></button>
          <button class="act" data-say="give me my system status." title="Status"><svg viewBox="0 0 24 24"><path d="M3 12h4l2-6 4 12 2-6h6"/></svg></button>
          <button class="act" data-say="what's my next meeting?" title="Agenda"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="17" rx="2"/><path d="M3 9h18M8 2v4M16 2v4"/></svg></button>
        </div>
      </section>

      <!-- console bar (always visible) -->
      <section class="bar">
        <div class="eye" title="optics">
          <video id="cam" autoplay muted playsinline></video>
          <canvas id="handfx"></canvas>
        </div>

        <!-- the MIC ORB: scroll or click to switch voice <-> text -->
        <div class="orb" id="orb" title="scroll or click to switch voice / text">
          <span class="r r1"></span><span class="r r2"></span><span class="r r3"></span>
          <div class="core"></div>
          <svg class="mic" viewBox="0 0 24 24"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M6 11a6 6 0 0 0 12 0M12 17v4M8 21h8"/></svg>
          <div class="wave" id="wave"><i></i><i></i><i></i><i></i><i></i><i></i><i></i></div>
        </div>

        <div class="mid">
          <div class="status" id="status">initialising…</div>
          <input id="msg" class="msg" type="text" placeholder="message Jarvis…" autocomplete="off" />
        </div>

        <div class="clock" id="clock">--:--</div>
      </section>
    </div>

    <div id="toast" class="toast"></div>
    <script src="renderer.js"></script>
    <script type="module" src="gestures.js"></script>
  </body>
</html>
