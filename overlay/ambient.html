<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600&family=Orbitron:wght@600;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="ambient.css" />
  </head>
  <body class="idle">
    <!-- corner reticles -->
    <div class="corner tl"><span></span><span></span></div>
    <div class="corner tr"><span></span><span></span></div>
    <div class="corner bl"><span></span><span></span></div>
    <div class="corner br"><span></span><span></span></div>
    <div class="scan"></div>
    <div class="rail left"></div><div class="rail right"></div>

    <!-- top-left identity -->
    <header class="brand">
      <div class="ring"><i></i><b>J</b></div>
      <div>
        <div class="title">J A R V I S</div>
        <div class="status" id="astatus">systems online</div>
      </div>
    </header>

    <!-- top-right clock/date/weather -->
    <div class="clockbox">
      <div class="clock" id="aclock">--:--</div>
      <div class="date" id="adate"></div>
      <div class="wx" id="awx"></div>
    </div>

    <!-- LEFT: subsystems (green/red) + live WhatsApp feed -->
    <aside class="left-col">
      <section class="card">
        <div class="clabel">SUBSYSTEMS <b id="sysratio">—</b></div>
        <div class="syslist" id="syslist"></div>
      </section>
      <section class="card wa">
        <div class="clabel"><span class="wadot"></span>WHATSAPP <b id="wacount">·</b></div>
        <div class="wafeed" id="wafeed"><div class="empty">no recent messages</div></div>
      </section>
    </aside>

    <!-- RIGHT: diagnostics + HUMAN RADAR (real map-style proximity display) -->
    <aside class="right-col">
      <section class="card">
        <div class="clabel">DIAGNOSTICS</div>
        <div class="trow"><label>CPU</label><div class="tbar"><i id="cpubar"></i></div><b id="cpu">--</b></div>
        <div class="trow"><label>MEM</label><div class="tbar"><i id="membar"></i></div><b id="mem">--</b></div>
        <div class="trow"><label>GPU</label><div class="tbar"><i id="gpubar"></i></div><b id="gpu">--</b></div>
        <div class="trow"><label>NET</label><div class="tbar"><i id="netbar"></i></div><b id="net">--</b></div>
      </section>
      <section class="card">
        <div class="clabel">HUMAN RADAR <b id="nearcount">—</b></div>
        <div class="hmap" id="hmap">
          <!-- range grid lines -->
          <div class="hgrid"></div>
          <!-- range labels -->
          <span class="hlabel hl-far">FAR</span>
          <span class="hlabel hl-mid">MID</span>
          <span class="hlabel hl-near">NEAR</span>
          <!-- centre Y axis line -->
          <div class="haxis"></div>
          <!-- detected blips go here -->
          <div class="hblips" id="hblips"></div>
          <!-- scan sweep line (left-to-right) -->
          <div class="hsweep"></div>
        </div>
        <div class="legend">
          <em><i class="lg wifi" style="background:var(--accent);"></i>PHYSICAL BODY (ACOUSTIC)</em>
          <em><b id="hradar-range">~4.5 m range</b></em>
        </div>
      </section>
    </aside>

    <script src="ambient.js"></script>
  </body>
</html>
